name: Local architecture validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.33.4
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.15.1
      - name: Frozen dependency installation without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Shared packages, types, tests, Prisma generation, and platform exports
        run: node scripts/validate.cjs
      - name: Public/native import and credential-pattern boundaries
        run: node scripts/check-boundaries.cjs
      - name: Isolated backend integration with a new disposable database
        run: node scripts/local-integration.cjs --run
      # No deploy, migration, remote push, EAS build, or store submission step.

# REVIEW TEMPLATE ONLY. Does not move, migrate or copy existing production data.
services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    env_file:
      - ${SERVER_ENV_FILE:?Set the absolute protected server env path}
    environment:
      DATABASE_URL: file:/data/wardrobe.db
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - type: bind
        source: ${SERVER_DATA_DIRECTORY:?Review and set the database directory}
        target: /data
      - type: bind
        source: ${SERVER_UPLOADS_DIRECTORY:?Review and set the existing uploads directory}
        target: /workspace/apps/server/uploads
    restart: unless-stopped
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set the canonical public URL}
        NEXT_PUBLIC_GRAPHQL_URL: /graphql
        NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME:-}
        GRAPHQL_INTERNAL_URL: http://server:4000/graphql
    environment:
      GRAPHQL_INTERNAL_URL: http://server:4000/graphql
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - server
    restart: unless-stopped
